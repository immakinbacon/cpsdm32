[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
dm32-proto = { path = "crates/dm32-proto" }
dm32-codeplug = { path = "crates/dm32-codeplug" }
thiserror = "2"
anyhow = "1"
serialport = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
